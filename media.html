<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            box-sizing: border-box;
            background-color: rgb(0, 0, 0);
            height: 100%;
        }
        
        .wrapper {
            border: 2px solid rgb(0, 255, 0);
            margin: 8px;
            height: calc(100% - 40px); /* 20px oben + 20px unten */
            overflow: auto; /* Optional: Falls der Inhalt zu lang ist, bleibt der Scrollbalken im Wrapper */
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <p>Dieser Inhalt hat einen Margin-Rand, aber der Border geht nicht nach unten.</p>
    </div>
</body>
</html>
