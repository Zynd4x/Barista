<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barista</title>
    <link rel="stylesheet" href="">
    <script src="index.js"></script>

    <style>
        body {
            background-color: #f6f0e8;
            color: #2b1d14;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            margin: 0;
        }

        *{
            box-sizing: border-box;
        }

        h1 {
            margin: 0;
        }
        .app {
            display: grid;
            grid-template: 
                "header header" 
                "display display" 
                "getraenke vorraete"
                "action action"; 
            max-width: 960px;
            margin: auto;
            padding: 1.5rem;
        }

        .kopf {
            grid-area: header;
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        .kopf h1 {
            margin: 0 0 .5rem;
            font-size: 1.6rem;
            color: #6f4e37;
        }

        .chip {
            background: #efe2d3;
            color: #6f4e37;
            padding: .2rem .8rem;
            border-radius: 999px;
            font-size: .8rem;
            align-items: center;
            display: flex;
        }

        .display {
            grid-area: display;
            display: flex;
            background-color: #1d1510;
            color: #f3e9de;
            align-items: center;
            border-radius: 14px;
            border-left: 6px solid #2f7d4f;
            margin-bottom: 1.25rem;
            padding: 1.25rem 1.5rem;
        }

        .status {
            margin: 0 auto 0 1rem;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 1.25rem;
        }

        
        .werte dd {
            margin: 0 0 0.7rem;
            font-size: 1.5rem;
        }
        
        .werte {
            margin: 0 1.5rem 0 0 ; 
        }

        .werte dt {
            font-size: .75rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #b09d8c;
        }
        
        
        .vorraete {
            grid-area: vorraete;
            padding: 20px;
        }
        
        .vorrat {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: .35rem;
        }
        
        .vorrat small {
            color: #7a6657;
            font-size: .8rem;
            margin-left: .35rem;
        }
        
        .vorrat progress {
            width: 150px;
            height: .7rem;
            margin: 0 .75rem;
            accent-color: #6f4e37;
        }
        
        button {
            font: inherit;
            cursor: pointer;
            color: #2b1d14;
            background: #fffaf3;
            border: 1px solid #e4d6c5;
            border-radius: 10px;
            padding: .7rem 1rem;
            margin: 0 .5rem .5rem 0;
        }

        button:hover:not(:disabled) {
            background: #efe2d3;
            border-color: #6f4e37;
        }
        
        button:disabled {
            cursor: not-allowed;
            opacity: .45;
        }

        .auswahl button.aktiv {
            background: #6f4e37;
            border-color: #6f4e37;
            color: #fff;
        }

        .vorrat-info {
            display: flex;
            flex-direction: column;
        }
        
        .vorrat-action {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        }


        .karte {
            background-color: #fffaf3;
            border: 1px solid #e4d6c5;
            border-radius: 14px;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
        }

        .karte h2 {
            margin: 0 0 1rem;
            font-size: .85rem;
            letter-spacing: .08rem;
            text-transform: uppercase;
            color: #7a6657;
        }

        .getraenke {
            grid-area: getraenke;
            padding: 20px;
        }

        .wahl {
            display: flex;
            gap: 1rem;
            height: fit-content;
        }

        .action {
            display: flex;
            grid-area: action;
            align-items: center;
            width: 100%;
            padding: 1.25rem;
            margin-top: 1rem;
        }

        .action span {
            margin-left: auto;
        }

        .aus {
            padding: 14px 26px;
            color: #b3382c;
            border-color: #b3382c;
        }

        .start {
            background: #2f7d4f;
            border-color: #2f7d4f;
            color: #fff;
            font-weight: 700;
            letter-spacing: .06em;
            padding: .9rem 2.2rem;
        }

        .start:hover:not(:disabled) {
            background: #276b43;
            border-color: #276b43;
        }

        .heizen, .reinigen {
            padding: 0.7rem;
        }
        .action button {
            margin: 0 0.2rem;
            border-radius: 8px;
            border: 1px solid #e4d6c5;
        }

    </style>
</head>
<body>
    <main class="app">
        <header class="kopf">
            <h1>Barista 2026</h1>
            <span class="chip">Version 2 &middot; HTML</span>
        </header>
        <section class="display">
            <p class="status">System bereit</p>
            <div class="werte">
                <dl>
                    <dt>Temparatur</dt>
                    <dd>20°</dd>
                </dl>
            </div>
            <div class="werte">
                <dl>
                    <dt>Reinugung in</dt>
                    <dd>10 Tassen</dd>
                </dl>
            </div>
        </section>
        <form action="" class="steuerung" method="get">
            <div class="wahl">
                <section class="karte getraenke">
                    <h2>Getränke wählen</h2>
                    <div class="auswahl">
                        <button name="getraenke" value="Espressp">Espresso</button>
                        <button name="getraenke" value="Kaffee">Kaffee</button>
                        <button class="aktiv" name="getraenke" value="Cappuccino">Cappuccino</button>
                        <button name="getraenke" value="Tee">Tee</button>
                    </div>
                </section>
                <section class="karte vorraete">
                    <h2>Vorräte</h2>
                    <div class="vorrat">
                        <div class="vorrat-info">
                            <span>Wasser</span>
                            <small>350 / 500</small>
                        </div>
                        <div class="vorrat-action">
                            <progress max="500" value="350"></progress>
                            <button name="action">füllen</button>
                        </div>
                    </div>
                    <div class="vorrat">
                        <div class="vorrat-info">
                            <span>Bohnen</span>
                            <small>90 / 150</small>
                        </div>
                        <div class="vorrat-action">
                            <progress max="150" value="90"></progress>
                            <button name="action">füllen</button>
                        </div>
                    </div>
                    <div class="vorrat">
                        <div class="vorrat-info">
                            <span>Milch</span>
                            <small>1000 / 1000</small>
                        </div>
                        <div class="vorrat-action">
                            <progress max="1000" value="1000"></progress>
                            <button name="action">füllen</button>
                        </div>
                    </div>
                    <div class="vorrat">
                        <div class="vorrat-info">
                            <span>Zucker</span>
                            <small>40 / 100</small>
                        </div>
                        <div class="vorrat-action">
                            <progress max="100" value="40"></progress>
                            <button name="action">füllen</button>
                        </div>
                    </div>
                </section>
            </div>
            <section class="karte action">
                <div>
                    <button name="action" class="heizen">Aufheitzen</button>
                    <button name="action" class="reinigen">Reinigung</button>
                </div>
                <span>
                    <button name="action" disabled class="start">START</button>
                    <button name="action" class="aus">Ausschalten</button>
                </span>
            </section>
        </form>
    </main>
</body>
</html>
