<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barista version 4 </title>
    <link rel="stylesheet" href="">
    <script src="index.js"></script>

    <style>
        /* Grundlagen */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f6f0e8;
            color: #2b1d14;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        h1 {
            margin: 0;
        }

        /* Seitenlayout */
        .app {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 12rem;
            grid-template-areas:
                "kopf kopf kopf"
                "display display action"
                "getraenke vorraete action";
            max-width: 960px;
            margin: 0 auto;
            padding: 1.5rem;
            column-gap: 1.25rem;
        }

        .steuerung {
            display: contents;
        }

        .kopf {
            display: flex;
            grid-area: kopf;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        .getraenke {
            grid-area: getraenke;
        }

        .vorraete {
            grid-area: vorraete;
        }

        .action {
            display: flex;
            grid-area: action;
            flex: 1 1 100%;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: stretch;
            gap: 0.75rem;
        }

        /* Kopfbereich und Display */
        .kopf h1 {
            margin: 0;
            color: #6f4e37;
            font-size: 1.6rem;
        }

        .chip {
            display: flex;
            align-items: center;
            padding: .2rem .8rem;
            border-radius: 999px;
            background: #efe2d3;
            color: #6f4e37;
            font-size: .8rem;
        }

        .display {
            display: flex;
            grid-area: display;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.25rem;
            padding: 1.25rem 1.5rem;
            border-left: 6px solid #2f7d4f;
            border-radius: 14px;
            background-color: #1d1510;
            color: #f3e9de;
        }

        .status {
            margin: 0;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 1.25rem;
        }

        .werte {
            display: flex;
            gap: 2rem;
            margin: 0;
        }

        .werte dt {
            color: #b09d8c;
            font-size: .75rem;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .werte dd {
            margin: 0;
            font-size: 1.5rem;
        }

        /* Karten und Getränkeauswahl */
        .karte {
            flex: 1;
            margin-bottom: 1.25rem;
            padding: 1.25rem;
            border: 1px solid #e4d6c5;
            border-radius: 14px;
            background-color: #fffaf3;
        }

        .karte h2 {
            margin: 0 0 1rem;
            color: #7a6657;
            font-size: .85rem;
            letter-spacing: .08rem;
            text-transform: uppercase;
        }

        .auswahl {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
        }

        .auswahl button {
            flex: 1;
            padding: 1.1rem 0.5rem;
            font-weight: 600;
        }

        .auswahl button.aktiv {
            border-color: #6f4e37;
            background: #6f4e37;
            color: #fff;
        }

        .neuesGetraenk {
            display: flex;
            width: 100%;
            justify-content: center;
        }

        /* Vorräte */
        .vorrat {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-areas:
                "name knopf"
                "balken balken";
            align-items: center;
            gap: 1rem;
        }

        .vorrat span {
            grid-area: name;
            flex: 0 0 6rem;
        }

        .vorrat span small {
            display: block;
            margin-left: 0;
        }

        .vorrat small {
            color: #7a6657;
            font-size: .8rem;
        }

        .vorrat progress {
            grid-area: balken;
            width: 100%;
            height: .7rem;
            margin-bottom: 0.75rem;
            accent-color: #6f4e37;
        }

        .vorrat button {
            grid-area: knopf;
            flex: none;
            padding: 0.35rem 0.75rem;
            font-size: 0.85rem;
        }

        /* Buttons */
        button {
            margin: 0;
            padding: .7rem 1rem;
            border: 1px solid #e4d6c5;
            border-radius: 10px;
            background: #fffaf3;
            color: #2b1d14;
            font: inherit;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            border-color: #6f4e37;
            background: #efe2d3;
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .heizen,
        .reinigen {
            padding: 0.7rem;
        }

        .start {
            padding: .9rem 2.2rem;
            margin-left: auto;
            border-color: #2f7d4f;
            background: #2f7d4f;
            color: #fff;
            font-weight: 700;
            letter-spacing: .06em;
        }

        .start:hover:not(:disabled) {
            border-color: #276b43;
            background: #276b43;
        }

        .aus {
            padding: 14px 26px;
            border-color: #b3382c;
            color: #b3382c;
            font-weight: 700;
        }

        /* Responsive Layout */
        @media (max-width: 900px) {
            .app {
                grid-template-columns: minmax(0, 1fr);
                grid-template-areas:
                    "kopf"
                    "display"
                    "getraenke"
                    "vorraete"
                    "action";
            }

            .action {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <header class="kopf">
            <h1>Barista 2026</h1>
            <span class="chip">Version 4 &middot; HTML</span>
        </header>

        <section class="display">
            <p class="status">System bereit</p>
            <dl class="werte">
                <div >
                    <dt>Temparatur</dt>
                    <dd>20°</dd>
                </div>         
                <div >
                    <dt>Reinugung in</dt>
                    <dd>10 Tassen</dd>
                </div>
            </dl>
        </section>

        <form action="" class="steuerung" method="post">

            <section class="karte getraenke">
                <h2>Getränke wählen</h2>
                <div class="auswahl">
                    <button name="getraenke" value="Espressp">Espresso</button>
                    <button name="getraenke" value="Kaffee">Kaffee</button>
                    <button name="getraenke" value="Cappuccino" class="aktiv">Cappuccino</button>
                    <button name="getraenke" value="Tee">Tee</button>
                    <button class="neuesGetraenk">Neues Getränk</button>
                </div>
            </section>
            
            <section class="karte vorraete">
                <h2>Vorräte</h2>

                <div class="vorrat">
                    <span>Wasser<small>350 / 500</small></span>
                    <progress max="500" value="350"></progress>
                    <button name="action" value="refillWasser">füllen</button>
                </div>

                <div class="vorrat">
                    <span>Bohnen<small>90 / 150</small></span>
                    <progress max="150" value="90"></progress>
                    <button name="action" value="refillBohnen">füllen</button>
                </div>

                <div class="vorrat">
                    <span>Milch<small>1000 / 1000</small></span>
                    <progress max="1000" value="1000"></progress>
                    <button name="action" value="refillMilch">füllen</button>
                </div>

                <div class="vorrat">
                    <span>Zucker<small>40 / 100</small></span>
                    <progress max="100" value="40"></progress>
                    <button name="action" value="refillZucker">füllen</button>
                </div> 
            </section>
            <section class="karte action">
                    <button name="action" value="heizen">Aufheizen</button>
                    <button name="action" value="reinigen">Reinigen</button>
                    <button name="action" disabled class="start" value="starten">STARTEN</button>
                    <button name="action" class="aus" value="reset">Ausschalten</button>
            </section>
        </form>
    </main>
</body>
</html>
